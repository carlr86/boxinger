# Runs the daily job (prices, deals, downgrades, digests, churn alerts, email retries).
# Needs two repository secrets: SITE_URL (e.g. https://boxinger.com) and CRON_SECRET.
name: Daily job

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 Argentina
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/daily
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/daily"
