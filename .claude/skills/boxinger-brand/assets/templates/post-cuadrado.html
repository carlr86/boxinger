<!doctype html>
<!-- Post cuadrado 1080 × 1080. Reemplazá {{ANTETITULO}}, {{TITULO}} (8 palabras o menos), {{BAJADA}}, {{ILUSTRACION}} (ruta al SVG relativa a este archivo) y {{PIE}} (por ejemplo boxinger.com).
     Si no hay ilustración, borrá el <div class="card">. Para 1080 × 1350 cambiá la altura de body.
     Exportar: python3 scripts/render.py post.html post.png --width 1080 --height 1080 --scale 2 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Temas: poné en <body> la clase tema-verde, tema-claro o tema-tinta */
.tema-verde{--bg:#059669;--fg:#ffffff;--soft:#d1fae5;--eye:#d1fae5;--lb:#ffffff;--lf:#059669}
.tema-claro{--bg:#f5f7f6;--fg:#0f172a;--soft:#475569;--eye:#047857;--lb:#059669;--lf:#fafafa}
.tema-tinta{--bg:#0f172a;--fg:#ffffff;--soft:#94a3b8;--eye:#10b981;--lb:#059669;--lf:#fafafa}
html,body{margin:0;padding:0}
body{width:1080px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Arial,sans-serif}
.in{box-sizing:border-box;height:100%;padding:65px;display:flex;flex-direction:column;gap:28px}
.eye{font-size:32px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--eye)}
h1{margin:0;font-size:90px;font-weight:800;letter-spacing:-0.035em;line-height:1.04;text-wrap:balance}
.sub{font-size:40px;font-weight:500;line-height:1.35;color:var(--soft)}
.card{flex:1;min-height:0;position:relative;background:#ffffff;border-radius:44px}
.card img{position:absolute;inset:32px;width:calc(100% - 64px);height:calc(100% - 64px);object-fit:contain}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:32px;font-weight:600}
.brand{display:flex;align-items:center;gap:17px;font-weight:800;font-size:47px;letter-spacing:-0.03em}
.brand svg{width:69px;height:69px}
</style></head>
<body class="tema-verde"><div class="in">
  <div class="eye">{{ANTETITULO}}</div>
  <h1>{{TITULO}}</h1>
  <div class="sub">{{BAJADA}}</div>
  <div class="card"><img src="{{ILUSTRACION}}" alt=""></div>
  <div class="foot"><span class="brand"><svg viewBox="18.5 28.6 362 362" aria-hidden="true"><path style="fill:var(--lb)" d="M308.74,36.87L90.77,36.88C73.25,37.77,57.85,49.15,51.9,65.56c-1.97,5.26-2.84,10.64-2.83,16.34l0.05,206.73c0,9.19,3.68,17.99,8.98,25.18c7.97,9.82,19.36,16.25,32.11,16.62l31.01,0.12l9.85,44.72c0.67,3.22,1.62,5.5,3.91,6.77c2.54,1.42,5.74,1.55,8.37-0.25l86.57-51.24l76.68-1c10.22,0,19.74-3.34,27.6-9.84c9.58-7.91,16.72-18.68,16.72-31.35l0.02-209.05C350.05,56.17,331.83,37.8,308.74,36.87z"/><path style="fill:var(--lf)" d="M206.57,266.88h-51.86c-7.49,0-12.83-1.68-16.03-5.04c-3.2-3.36-4.8-8.7-4.8-16.03V118.25c0-7.49,1.64-12.87,4.92-16.15s8.59-4.92,15.92-4.92h54.98c8.1,0,15.13,0.5,21.07,1.5c5.94,1,11.27,2.93,15.97,5.79c4.01,2.39,7.56,5.42,10.65,9.09c3.09,3.67,5.44,7.72,7.06,12.15c1.62,4.44,2.43,9.13,2.43,14.06c0,16.98-8.49,29.4-25.47,37.27c22.3,7.1,33.45,20.91,33.45,41.44c0,9.49-2.43,18.04-7.29,25.64c-4.86,7.6-11.42,13.22-19.68,16.84c-5.17,2.16-11.11,3.68-17.83,4.57S215.53,266.88,206.57,266.88z M168.26,123v43.87h31.48c8.57,0,15.18-0.81,19.85-2.43s8.24-4.71,10.71-9.26c1.93-3.24,2.89-6.87,2.89-10.88c0-8.57-3.05-14.26-9.14-17.07c-6.1-2.82-15.4-4.22-27.9-4.22H168.26z M204.03,191.52h-35.77v49.54h36.93c23.23,0,34.84-8.37,34.84-25.12c0-8.57-3.01-14.78-9.03-18.64C224.98,193.45,215.99,191.52,204.03,191.52z"/></svg>Boxinger</span><span>{{PIE}}</span></div>
</div></body></html>
