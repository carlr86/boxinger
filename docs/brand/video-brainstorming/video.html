<!doctype html>
<!-- Video de LinkedIn «Brainstorming en Boxinger» (1080 × 1350, 7 diapositivas que se deslizan solas).
     Mismo estilo que docs/brand/video-buzones. Cada cuadro sale de renderAt(segundos); grabar.py lo graba y guarda
     en eventos.json los momentos de cada clic, voto y pase de diapositiva para que sonido.py arme los efectos.
     Para mirarlo en el navegador, abrí el archivo con ?play al final de la ruta. -->
<html lang="es"><head><meta charset="utf-8">
<title>Brainstorming en Boxinger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
:root{--verde:#059669;--hondo:#047857;--brote:#10b981;--tinta:#0f172a;--tv:#0b2b22;--niebla:#f5f7f6;--menta:#d1fae5;
  --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--pj:"Plus Jakarta Sans",var(--sys)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;background:var(--niebla);font-family:var(--sys);-webkit-font-smoothing:antialiased}
.slide{position:absolute;inset:0;overflow:hidden}
.light{background:var(--niebla);--fg:#0f172a;--soft:#475569;--acc:#059669;--line:#059669;--pillbg:#0f172a;--pillfg:#fff}
.dark{background:radial-gradient(120% 70% at 80% 10%,#0f3d30 0%,#0b2b22 60%);--fg:#fff;--soft:#94a3b8;--acc:#10b981;--line:#10b981;--pillbg:#fff;--pillfg:#0b2b22}
.green{background:radial-gradient(120% 80% at 85% 5%,#0aa678 0%,#059669 55%,#04805a 100%);--fg:#fff;--soft:#d1fae5;--acc:#d1fae5;--line:#d1fae5;--pillbg:#fff;--pillfg:#047857}
.top{position:absolute;left:64px;right:64px;top:62px;height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--soft)}
.top .d{font:500 24px var(--mono)}
.top .h{font:600 25px var(--pj);color:var(--fg);opacity:.8}
.top .p{font:800 21px var(--pj);letter-spacing:.06em;background:var(--pillbg);color:var(--pillfg);padding:8px 16px;border-radius:999px;text-transform:uppercase}
.eye{position:absolute;left:64px;font:700 30px var(--mono);letter-spacing:.04em;color:var(--acc)}
h1{position:absolute;left:64px;right:40px;margin:0;font:800 100px/1.0 var(--pj);letter-spacing:-.045em;word-spacing:.08em;color:var(--fg)}
h1 em{font-style:italic;color:var(--acc);letter-spacing:-.04em}
.green h1 em{color:var(--menta)}
.lineb{position:absolute;left:0;right:0;top:1168px;height:4px;background:var(--line)}
.dot{position:absolute;top:1158px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:4px solid var(--line)}
.light .dot{background:var(--niebla)} .dark .dot{background:var(--tv)} .green .dot{background:var(--verde)}
.foot{position:absolute;left:64px;right:64px;top:1208px;display:flex;justify-content:space-between;align-items:center;font:800 38px var(--pj);color:var(--fg);letter-spacing:-.02em}
.foot b{color:var(--acc)}
.foot .r{font-size:32px;color:var(--acc);letter-spacing:.02em}
.stub{position:absolute;overflow:visible}
.note{position:absolute;font:italic 700 34px var(--pj);color:var(--acc);white-space:nowrap;letter-spacing:-.02em}
.arrow{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* Tarjetas de la app (escala ~1,6 de la app real) */
.card{position:absolute;left:64px;right:64px;background:#fff;border-radius:24px;box-shadow:0 30px 70px rgba(11,43,34,.18),0 4px 14px rgba(11,43,34,.08);color:rgba(0,0,0,.88);font-family:var(--sys);overflow:hidden}
.dark .card{box-shadow:0 30px 80px rgba(0,0,0,.45)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:28px 34px 0;font-size:27px;font-weight:600;gap:14px}
.mb{padding:22px 34px 30px;display:flex;flex-direction:column;gap:18px}
.small{font-size:19.5px;color:rgba(0,0,0,.55);line-height:1.45}
.kchip{display:inline-flex;align-items:center;gap:6px;font-size:19px;font-weight:600;color:#ad4e00;background:#fff7e6;border:1.5px solid #ffd591;border-radius:999px;padding:4px 14px;white-space:nowrap}
.toast{position:absolute;left:50%;top:26px;background:#fff;border-radius:14px;padding:16px 22px;font-size:23px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.08);white-space:nowrap;z-index:5}
.b1{height:46px;padding:0 20px;border-radius:9px;border:1.5px solid #d9d9d9;background:#fff;font-size:20px;display:inline-flex;align-items:center;white-space:nowrap}
.acc{height:40px;padding:0 16px;border-radius:8px;border:1.5px solid #d9d9d9;background:#fff;font-size:18px;display:inline-flex;align-items:center;white-space:nowrap}
.okt{height:34px;padding:0 12px;border-radius:7px;border:1.5px solid #b7eb8f;background:#f6ffed;color:#389e0d;font-size:18px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

/* 2 · ideas que reciben votos */
.irow{display:flex;align-items:center;gap:18px;padding:18px 0;border-top:1.5px solid #f3f4f6;position:relative}
.irow:first-child{border-top:0}
.irow .tx{flex:1;display:flex;flex-direction:column;gap:6px}
.irow .tx b{font-size:24px;font-weight:600;line-height:1.3}
.irow .au{display:flex;align-items:center;gap:8px;font-size:18px;color:rgba(0,0,0,.55)}
.av{flex:none;display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600}
.pts{flex:none;min-width:110px;height:48px;border-radius:10px;border:1.5px solid var(--verde);color:var(--verde);font-size:21px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.vchip{position:absolute;right:130px;height:38px;padding:0 14px;border-radius:19px;background:#fff;border:1.5px solid #a7f3d0;color:var(--hondo);font:700 18px var(--pj);display:flex;align-items:center;white-space:nowrap;box-shadow:0 4px 10px rgba(5,150,105,.14)}

/* 3 · escala de votos */
.seg{display:flex;background:#f0f0f0;border-radius:12px;padding:4px;align-self:flex-start}
.seg span{padding:0 22px;height:50px;display:flex;align-items:center;font-size:22px;color:rgba(0,0,0,.6);border-radius:9px}
.seg span.on{background:#fff;color:rgba(0,0,0,.88);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.prev{border:1.5px solid #f0f0f0;border-radius:16px;background:#fafafa;padding:22px 26px;height:250px;position:relative}
.prev .lb{font:700 17px var(--mono);letter-spacing:.06em;color:rgba(0,0,0,.4)}
.pv{position:absolute;left:26px;right:26px;top:62px}
.vopt{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 18px;font-size:22px;margin-bottom:10px}
.vopt span{font-size:18px;color:rgba(0,0,0,.45)}
.vopt.on{background:#ecfdf5;border-color:#a7f3d0;color:var(--hondo)}
.stars{display:flex;gap:14px;margin-top:22px}
.like{display:inline-flex;align-items:center;gap:14px;margin-top:26px;height:76px;padding:0 30px;border-radius:38px;border:2px solid var(--verde);color:var(--verde);font-size:28px;font-weight:600;background:#fff}

/* 4 · Agrupar */
.col{position:absolute;top:24px;bottom:24px;border-radius:16px;padding:14px}
.col .hd{display:flex;align-items:baseline;gap:8px;font-size:20px;font-weight:600;color:rgba(0,0,0,.7)}
.col .hd span{margin-left:auto;font-size:16px;font-weight:400;color:rgba(0,0,0,.45);white-space:nowrap}
.mi{position:absolute;background:#fff;border-radius:12px;border:1.5px solid #f0f0f0;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;height:112px}
.mi b{font-size:18.5px;font-weight:600;line-height:1.3}
.mi span{font-size:15.5px;color:rgba(0,0,0,.55)}

/* 5 · Matriz */
.mx{position:absolute;left:96px;right:30px;top:30px;height:470px;background:#fafbfc;border-radius:12px}
.mx .cn{position:absolute;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:rgba(0,0,0,.5);background:rgba(250,251,252,.92);padding:2px 8px;border-radius:5px;z-index:2}
.mx .vl{position:absolute;left:50%;top:6%;bottom:6%;width:1.5px;background:#e6e8ec}
.mx .hl{position:absolute;top:50%;left:4%;right:4%;height:1.5px;background:#e6e8ec}
.bub{position:absolute;border-radius:50%;background:#dcdde1;transform-origin:center}
.ax{position:absolute;font-size:16px;letter-spacing:.07em;color:rgba(0,0,0,.45)}
.tip{position:absolute;background:var(--tinta);color:#fff;border-radius:12px;padding:12px 16px;font-size:19px;white-space:nowrap;z-index:3}
.tip small{display:block;font-size:16px;color:#a7f3d0;margin-top:3px}

/* 6 · Aceptar */
.gcol{border-radius:16px;background:#fafafa;border:1.5px solid #f0f0f0;border-top:5px solid #7aa7f5;padding:18px;display:flex;flex-direction:column;gap:12px}
.gi{background:#fff;border-radius:12px;border:1.5px solid #f0f0f0;border-left:5px solid #7aa7f5;padding:14px 18px;display:flex;align-items:center;gap:14px}

.gi b{font-size:21px;font-weight:600}
.gi span.m{font-size:17px;color:rgba(0,0,0,.55)}
.blog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:20px}
.blog .bt{font-weight:600}
.bk{background:#ecfdf5;border:1.5px solid #6ee7b7;color:var(--hondo);border-radius:999px;padding:6px 14px;font-size:18px}

/* 1 · portada */
.tiles{position:absolute;left:64px;right:64px;top:170px;display:flex;justify-content:space-between;align-items:flex-start}
.tile{width:220px;display:flex;flex-direction:column;align-items:center;gap:22px}
.tile .sq{width:200px;height:200px;border-radius:44px;background:#fff;box-shadow:0 18px 40px rgba(11,43,34,.12),0 2px 6px rgba(11,43,34,.06);display:grid;place-items:center;position:relative;color:#047857}
.tile .lb{font:500 25px var(--mono);color:#475569}
.badge{position:absolute;right:-12px;top:-12px;width:50px;height:50px;border-radius:50%;background:var(--verde);display:grid;place-items:center;box-shadow:0 0 0 5px var(--niebla)}
.dash{position:absolute;top:268px;height:4px;background-image:linear-gradient(90deg,#b9c6bf 50%,transparent 50%);background-size:18px 4px}
.mov{position:absolute;top:262px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--verde)}
.notif{position:absolute;left:280px;width:680px;top:500px;background:#fff;border:3px solid var(--verde);border-radius:26px;padding:24px 30px;box-shadow:0 22px 50px rgba(11,43,34,.14)}
.notif .t1{display:flex;justify-content:space-between;font:500 22px var(--sys);color:#475569;align-items:center}
.notif .t2{font:800 33px var(--pj);letter-spacing:-.03em;color:var(--tinta);margin-top:12px}
.notif .t3{font:500 24px var(--sys);color:#475569;margin-top:6px}
.notif .t3 b{color:var(--verde)}
.cta{position:absolute;left:64px;top:1030px;background:var(--tinta);color:#fff;font:800 32px var(--pj);letter-spacing:-.02em;padding:18px 30px;border-radius:999px}
.cta b{color:var(--brote)}

/* 7 · cierre */
.chk{display:flex;align-items:center;gap:20px;font-size:26px;padding:15px 0;border-top:1.5px solid #f3f4f6}
.chk:first-of-type{border-top:0}
.chk .bx{width:40px;height:40px;border-radius:9px;border:2px solid #cbd5d1;display:grid;place-items:center;flex:none}
.chk .bx.on{background:var(--verde);border-color:var(--verde)}
.chk b{font-weight:600}
.bar7{position:absolute;left:64px;right:64px;background:var(--tinta);color:#fff;border-radius:20px;padding:24px 30px;font:700 27px var(--pj);display:flex;align-items:center;gap:16px;letter-spacing:-.01em}
.bar7 em{font-style:normal;color:var(--brote)}
.lock{position:absolute;left:64px;display:flex;align-items:center;gap:18px;font:800 54px var(--pj);color:#fff;letter-spacing:-.03em}
.lock svg{width:64px;height:64px}
</style></head>

<script>
// ---------- Utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const io = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

// ---------- Datos (Pampa Pagos, empresa ficticia de la marca) ----------
const IDEAS = {

function rel(el) { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2, b: r.bottom }; }

  });

    $('stub' + n).innerHTML = `<path d="M${x} ${y0} V${y1 - 26} Q${x} ${y1} ${x + 26} ${y1}" fill="none" stroke="var(--line)" stroke-width="4"/>`;
  });
  // Flechas de las notas
  for (const [n, k] of Object.entries(NOTES)) {
    const note = document.createElement('div');
    note.className = 'note'; note.textContent = k.text;
    note.style.left = k.x + 'px'; note.style.top = k.y + 'px';
    els[n].appendChild(note);
    k.el = note;
    const tr = rel($(k.to)), w = note.offsetWidth;
    const ex = k.right ? tr.x + tr.w - 24 : tr.cx + k.dx, ey = tr.y + k.dy;
    let sx, sy;
    if (k.side) { // llega de costado, a la derecha del destino, para no cruzar texto
      const ex2 = tr.x + tr.w + 14, ey2 = tr.cy, sx2 = k.x + 40, sy2 = k.y + 50, a2 = Math.PI, h2 = 16;
      $('ar' + n).innerHTML = `<path class="ap" d="M${sx2} ${sy2} Q${sx2} ${ey2} ${ex2} ${ey2}" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/><path class="ah" d="M${ex2 + h2 * Math.cos(0.5)} ${ey2 - h2 * Math.sin(0.5)} L${ex2} ${ey2} L${ex2 + h2 * Math.cos(0.5)} ${ey2 + h2 * Math.sin(0.5)}" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
      const ap2 = $('ar' + n).querySelector('.ap'); k.len = ap2.getTotalLength(); ap2.style.strokeDasharray = k.len;
      continue;
    }
    if (ex < k.x) { sx = k.x - 14; sy = k.y + 24; } else if (ex > k.x + w) { sx = k.x + w + 14; sy = k.y + 24; } else { sx = ex; sy = k.y + 52; }
    const cx = ex, cy = sy, ang = Math.atan2(ey - cy, ex - cx), h = 16;

    const ap = $('ar' + n).querySelector('.ap');
    k.len = ap.getTotalLength(); ap.style.strokeDasharray = k.len;

// ---------- Eventos de sonido ----------
function buildEvents() {
  const at = (n, lt, k) => EVENTS.push({ t: +(SL[n].start + lt).toFixed(3), k });
  for (let n = 1; n < N; n++) EVENTS.push({ t: +(SL[n].start - SWIPE / 2).toFixed(3), k: 'swipe' });
  EVENTS.push({ t: SL[N - 1].start, k: 'final' });
  at(0, 0.3, 'pop'); at(0, 0.45, 'pop'); at(0, 0.6, 'pop'); at(0, 2.35, 'chime'); at(0, 2.7, 'pop');
  VOTES2.forEach((v) => at(1, v[0], 'vote'));
  at(2, 1.9, 'click'); [2.25, 2.4, 2.55, 2.7].forEach((x) => at(2, x, 'tick')); at(2, 3.6, 'click'); at(2, 4.0, 'pop');
  MOVES.forEach(([, , a, b]) => { at(3, a, 'pick'); at(3, b, 'drop'); });
  BUBS.forEach((_, n) => at(4, 0.7 + n * 0.18, 'pop')); at(4, 2.4, 'click');
  at(5, 1.8, 'click'); at(5, 1.9, 'chime'); at(5, 3.1, 'click'); at(5, 3.2, 'chime');
  [1.0, 1.45, 1.9, 2.35].forEach((x) => at(6, x, 'tick')); at(6, 3.2, 'chime');
  EVENTS.sort((a, b) => a.t - b.t);
}

// ---------- Cuadro ----------
function renderAt(t) {
  els.forEach((e, n) => {
    let x = 0;
    const s0 = SL[n].start, s1 = s0 + SL[n].dur;
    if (n > 0) x = 1080 * (1 - prog(t, s0 - SWIPE / 2, s0 + SWIPE / 2));
    if (n < N - 1) x -= 1080 * prog(t, s1 - SWIPE / 2, s1 + SWIPE / 2);
    const vis = t > s0 - SWIPE / 2 - 0.01 && t < s1 + SWIPE / 2 + 0.01;
    e.style.display = vis ? 'block' : 'none';
    e.style.transform = `translateX(${x}px)`;
    if (!vis) return;
    const lt = t - s0;
    const ti = prog(lt, -0.15, 0.45, out);
    e.querySelectorAll('h1,.eye').forEach((h) => { h.style.opacity = n === 0 ? 1 : 0.2 + 0.8 * ti; h.style.transform = `translateY(${lerp(18, 0, ti)}px)`; });
    $('dot' + n).style.left = lerp(64, 1016, clamp(lt / SL[n].dur)) + 'px';
    const k = NOTES[n];
    if (k) {
      const a = prog(lt, k.at, k.at + 0.6, out);
      k.el.style.opacity = prog(lt, k.at, k.at + 0.3); k.el.style.transform = `translateX(${lerp(-12, 0, a)}px)`;
      const ar = $('ar' + n); ar.querySelector('.ap').style.strokeDashoffset = k.len * (1 - a);
      ar.querySelector('.ah').style.opacity = a > 0.95 ? 1 : 0;
    }
    const card = e.querySelector('.card');
    if (card && n > 0) { const c = prog(lt, 0.0, 0.6, out); card.style.transform = `translateY(${lerp(50, 0, c)}px)`; card.style.opacity = 0.3 + 0.7 * c; }
    SCENES[n](lt);
  });
}

const SCENES = [
  (lt) => { // 1 · Portada
    ['t1', 't2', 't3'].forEach((id, n) => { const k = prog(lt, 0.2 + n * 0.15, 0.75 + n * 0.15, back); $(id).style.transform = `scale(${lerp(0.6, 1, k)})`; $(id).style.opacity = clamp(k * 2); });

    [0, 1, 2, 3, 4].forEach((n) => { const on = lt > 2.25 + n * 0.15 && n < 4; $('st' + n).innerHTML = STAR(on); $('st' + n).style.transform = `scale(${1 + 0.25 * (prog(lt, 2.25 + n * 0.15, 2.4 + n * 0.15, out) - prog(lt, 2.4 + n * 0.15, 2.6 + n * 0.15, out)) * (n < 4)})`; $('st' + n).style.display = 'inline-block'; });
    const lk = prog(lt, 4.0, 4.15, out) - prog(lt, 4.15, 4.4, out);
    $('lk2').style.transform = `scale(${1 + 0.12 * lk})`; $('lk2').style.background = lt > 4.0 ? '#ecfdf5' : '#fff';
    $('lkn').textContent = lt > 4.0 ? 24 : 23;
  },
  (lt) => { // 4 · Agrupar
    let m = -1, p = 0; MOVES.forEach(([, , a, b], i) => { if (lt >= a) { m = i; p = clamp((lt - a) / (b - a)); } });
    const from = place(states[m < 0 ? 0 : (p >= 1 ? m + 1 : m)]), to = place(states[m < 0 ? 0 : m + 1]);
    const k = io(p >= 1 ? 1 : p);
    ORDER.forEach((id) => {
      const el = $('mi' + id), A = from[id], B = to[id];

      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.transform = moving ? `rotate(${3 * Math.sin(Math.PI * k)}deg) scale(${1 + 0.05 * Math.sin(Math.PI * k)})` : 'none';

      el.style.zIndex = moving ? 5 : 1;

  },
  (lt) => { // 5 · Matriz
    BUBS.forEach((_, n) => { const k = prog(lt, 0.7 + n * 0.18, 1.1 + n * 0.18, back); const b = $('bb' + n); b.style.transform = `scale(${k})`; b.style.opacity = clamp(k * 3);
      const sel = n === 0 && lt > 2.4; b.style.background = sel ? '#d6e4fb' : '#dcdde1'; b.style.boxShadow = sel ? '0 0 0 5px #7aa7f5' : 'none'; });
    const tp = prog(lt, 2.45, 2.8, out); $('tip').style.opacity = tp; $('tip').style.transform = `translateX(${lerp(-12, 0, tp)}px)`;
  },
  (lt) => { // 6 · Aceptar
    [1.8, 3.1, 99].forEach((a, n) => {
      const done = lt > a + 0.05;
      const el = $('ac' + n);
      const want = done ? 'ok' : 'btn';
